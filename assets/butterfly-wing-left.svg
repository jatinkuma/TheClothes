<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 80" width="70" height="80">
  <defs>
    <linearGradient id="wingGradL" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#180b4f" />
      <stop offset="25%" stop-color="#4a148c" />
      <stop offset="55%" stop-color="#2979ff" />
      <stop offset="80%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <radialGradient id="glowL" cx="60%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#69f0ae" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2979ff" stop-opacity="0" />
    </radialGradient>
    <filter id="wingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Forewing Left -->
  <path d="M 68 36 C 60 18, 42 2, 18 2 C 8 2, 2 10, 4 20 C 6 30, 22 42, 38 46 C 54 50, 64 45, 68 36 Z"
        fill="url(#wingGradL)" filter="url(#wingGlow)" stroke="#0d47a1" stroke-width="0.8" />
  <path d="M 68 36 C 60 18, 42 2, 18 2 C 8 2, 2 10, 4 20 C 6 30, 22 42, 38 46 C 54 50, 64 45, 68 36 Z"
        fill="url(#glowL)" />
  <!-- Hindwing Left -->
  <path d="M 66 38 C 58 44, 46 48, 30 52 C 16 56, 12 66, 20 74 C 28 82, 48 78, 58 64 C 64 54, 66 44, 66 38 Z"
        fill="url(#wingGradL)" filter="url(#wingGlow)" stroke="#1a237e" stroke-width="0.8" />
  <!-- Wing veins -->
  <g stroke="rgba(255,255,255,0.45)" stroke-width="0.6" fill="none">
    <path d="M 66 36 Q 40 24 16 12" />
    <path d="M 66 36 Q 36 32 10 24" />
    <path d="M 66 36 Q 42 40 24 38" />
    <path d="M 65 42 Q 46 56 26 68" />
    <path d="M 65 42 Q 52 64 42 74" />
  </g>
  <!-- Edge Sparkles -->
  <circle cx="10" cy="14" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="6" cy="22" r="1" fill="#ffffff" opacity="0.8" />
  <circle cx="14" cy="28" r="0.9" fill="#ffffff" opacity="0.8" />
  <circle cx="18" cy="72" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="26" cy="77" r="1" fill="#ffffff" opacity="0.8" />
</svg>

