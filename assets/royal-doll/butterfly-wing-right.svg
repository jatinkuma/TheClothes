<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 80" width="70" height="80">
  <defs>
    <linearGradient id="wingGradR" x1="100%" y1="30%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#180b4f" />
      <stop offset="25%" stop-color="#4a148c" />
      <stop offset="55%" stop-color="#2979ff" />
      <stop offset="80%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <radialGradient id="glowR" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#69f0ae" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2979ff" stop-opacity="0" />
    </radialGradient>
    <filter id="wingGlowR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Forewing Right -->
  <path d="M 2 36 C 10 18, 28 2, 52 2 C 62 2, 68 10, 66 20 C 64 30, 48 42, 32 46 C 16 50, 6 45, 2 36 Z"
        fill="url(#wingGradR)" filter="url(#wingGlowR)" stroke="#0d47a1" stroke-width="0.8" />
  <path d="M 2 36 C 10 18, 28 2, 52 2 C 62 2, 68 10, 66 20 C 64 30, 48 42, 32 46 C 16 50, 6 45, 2 36 Z"
        fill="url(#glowR)" />
  <!-- Hindwing Right -->
  <path d="M 4 38 C 12 44, 24 48, 40 52 C 54 56, 58 66, 50 74 C 42 82, 22 78, 12 64 C 6 54, 4 44, 4 38 Z"
        fill="url(#wingGradR)" filter="url(#wingGlowR)" stroke="#1a237e" stroke-width="0.8" />
  <!-- Wing veins -->
  <g stroke="rgba(255,255,255,0.45)" stroke-width="0.6" fill="none">
    <path d="M 4 36 Q 30 24 54 12" />
    <path d="M 4 36 Q 34 32 60 24" />
    <path d="M 4 36 Q 28 40 46 38" />
    <path d="M 5 42 Q 24 56 44 68" />
    <path d="M 5 42 Q 18 64 28 74" />
  </g>
  <!-- Edge Sparkles -->
  <circle cx="60" cy="14" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="64" cy="22" r="1" fill="#ffffff" opacity="0.8" />
  <circle cx="56" cy="28" r="0.9" fill="#ffffff" opacity="0.8" />
  <circle cx="52" cy="72" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="44" cy="77" r="1" fill="#ffffff" opacity="0.8" />
</svg>
